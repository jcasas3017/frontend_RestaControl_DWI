
<form
  class="plato-formulario"
  #platoForm="ngForm"
  (ngSubmit)="enviarFormulario()"
>
  <h2>
    {{ plato ? 'Editar plato' : 'Nuevo plato' }}
  </h2>

  <div class="form-group">
    <label for="codigo">Código *</label>
    <input
      id="codigo"
      name="codigo"
      type="text"
      [(ngModel)]="formulario.codigo"
      required
      maxlength="30"
      placeholder="Ejemplo: PLA000008"
    />
  </div>

  <div class="form-group">
    <label for="categoria">Categoría *</label>
    <select
      id="categoria"
      name="idCategoria"
      [(ngModel)]="formulario.idCategoria"
      required
    >
      <option value="" disabled>Seleccione una categoría</option>
      @for (categoria of categorias; track categoria.id) {
        @if (categoria.activo || categoria.id === formulario.idCategoria) {
          <option [value]="categoria.id">
            {{ categoria.nombre }}
          </option>
        }
      }
    </select>
  </div>

  <div class="form-group">
    <label for="nombre">Nombre *</label>
    <input
      id="nombre"
      name="nombre"
      type="text"
      [(ngModel)]="formulario.nombre"
      required
      maxlength="100"
      placeholder="Ejemplo: Arroz con pollo"
    />
  </div>

  <div class="form-group">
    <label for="descripcion">Descripción</label>
    <textarea
      id="descripcion"
      name="descripcion"
      [(ngModel)]="formulario.descripcion"
      rows="3"
      placeholder="Descripción del plato"
    ></textarea>
  </div>

  <div class="form-group">
    <label for="precio">Precio (S/) *</label>
    <input
      id="precio"
      name="precio"
      type="number"
      [(ngModel)]="formulario.precio"
      required
      min="0.01"
      step="0.01"
    />
  </div>

  <div class="form-group">
    <label for="disponible">Disponibilidad</label>
    <select
      id="disponible"
      name="disponible"
      [(ngModel)]="formulario.disponible"
    >
      <option [ngValue]="true">Disponible</option>
      <option [ngValue]="false">No disponible</option>
    </select>
  </div>

  <div class="form-group">
    <label for="activo">Estado</label>
    <select
      id="activo"
      name="activo"
      [(ngModel)]="formulario.activo"
    >
      <option [ngValue]="true">Activo</option>
      <option [ngValue]="false">Inactivo</option>
    </select>
  </div>

  <div class="form-actions">
    <button
      type="button"
      class="btn-cancelar"
      (click)="cancelarFormulario()"
      [disabled]="guardando"
    >
      Cancelar
    </button>

    <button
      type="submit"
      class="btn-guardar"
      [disabled]="platoForm.invalid || guardando"
    >
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</form>
