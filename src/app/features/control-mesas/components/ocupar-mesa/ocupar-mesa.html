<div class="modal-overlay" (click)="cerrar.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <div>
        <h2>{{ mesa.codigo }} · Mesa libre</h2>
        <p>
          {{ mesa.ubicacion || 'Sin ubicación' }}
          · {{ mesa.capacidad }} personas
        </p>
      </div>

      <button
        type="button"
        class="btn-close"
        (click)="cerrar.emit()">
        ×
      </button>
    </div>

    <div class="modal-body">

      <p class="description">
        Seleccione el cliente y el mozo responsable
        para registrar la ocupación de esta mesa.
      </p>

      <div *ngIf="cargando" class="loading">
        Cargando clientes y mozos...
      </div>

      <ng-container *ngIf="!cargando">

        <div class="form-group">
          <label for="busquedaCliente">Buscar cliente</label>

          <input
            id="busquedaCliente"
            type="text"
            [(ngModel)]="busquedaCliente"
            placeholder="Nombre, código o documento" />
        </div>

        <div class="form-group">
          <label for="cliente">Cliente *</label>

          <select id="cliente" [(ngModel)]="idCliente">
            <option value="">Seleccione un cliente</option>

            <option
              *ngFor="let cliente of clientesFiltrados"
              [value]="cliente.id">
              {{ cliente.nombres }} {{ cliente.apellidos }}
              - {{ cliente.documento }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="mozo">Mozo responsable *</label>

          <select id="mozo" [(ngModel)]="idMozo">
            <option value="">Seleccione un mozo</option>

            <option *ngFor="let mozo of mozos" [value]="mozo.id">
              {{ mozo.nombres }} {{ mozo.apellidos }}
            </option>
          </select>
        </div>

        <p class="info">
          Podrá agregar los platos después de ocupar la mesa.
        </p>

      </ng-container>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

    </div>

    <div class="modal-footer">
      <button
        type="button"
        class="btn-cancelar"
        [disabled]="guardando"
        (click)="cerrar.emit()">
        Cancelar
      </button>

      <button
        type="button"
        class="btn-guardar"
        [disabled]="cargando || guardando || !idCliente || !idMozo"
        (click)="ocuparMesa()">
        {{ guardando ? 'Registrando...' : 'Ocupar mesa' }}
      </button>
    </div>

  </div>
</div>
