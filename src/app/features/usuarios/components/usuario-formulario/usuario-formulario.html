<form (ngSubmit)="guardar()" #usuarioForm="ngForm">

  <h3>
    {{ usuario ? 'Editar Usuario' : 'Nuevo Usuario' }}
  </h3>

  <p class="subtitle">
    Completa los datos del usuario.
  </p>

  <div *ngIf="error" class="form-error">
    {{ error }}
  </div>

  <div class="form-group">
    <label for="codigo">Código *</label>
    <input
      id="codigo"
      type="text"
      name="codigo"
      [(ngModel)]="formulario.codigo"
      maxlength="20"
      required
      placeholder="Ej. USR000008">
  </div>

  <div class="form-group">
    <label for="nombres">Nombres *</label>
    <input
      id="nombres"
      type="text"
      name="nombres"
      [(ngModel)]="formulario.nombres"
      required
      placeholder="Nombres">
  </div>

  <div class="form-group">
    <label for="apellidos">Apellidos *</label>
    <input
      id="apellidos"
      type="text"
      name="apellidos"
      [(ngModel)]="formulario.apellidos"
      required
      placeholder="Apellidos">
  </div>

  <div class="form-group">
    <label for="username">Nombre de usuario *</label>
    <input
      id="username"
      type="text"
      name="username"
      [(ngModel)]="formulario.username"
      autocomplete="off"
      required
      placeholder="Ej. jperez">
  </div>

  <div class="form-group">
    <label for="password">
      {{ usuario ? 'Nueva contraseña (opcional)' : 'Contraseña *' }}
    </label>
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="formulario.password"
      [required]="!usuario"
      autocomplete="new-password"
      [placeholder]="usuario
        ? 'Dejar vacío para conservar la contraseña'
        : 'Ingresa una contraseña'">
  </div>

  <div class="form-group">
    <label for="rol">Rol *</label>
    <select
      id="rol"
      name="rol"
      [(ngModel)]="formulario.rol"
      required>
      <option
        *ngIf="formulario.rol && !rolesValidosIncluyen(formulario.rol)"
        [value]="formulario.rol"
        disabled>
        Rol anterior: {{ formulario.rol }} (selecciona uno válido)
      </option>
      <option *ngFor="let rol of roles" [value]="rol.valor">
        {{ rol.nombre }}
      </option>
    </select>
  </div>

  <div class="checkbox-group">
    <input
      id="activo"
      type="checkbox"
      name="activo"
      [(ngModel)]="formulario.activo">
    <label for="activo">Usuario activo</label>
  </div>

  <div class="form-actions">
    <button
      type="button"
      class="btn-cancel"
      [disabled]="guardando"
      (click)="cancelar()">
      Cancelar
    </button>

    <button
      type="submit"
      class="btn-save"
      [disabled]="guardando || usuarioForm.invalid">
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>

</form>
