
<form
  class="categoria-formulario"
  #categoriaForm="ngForm"
  (ngSubmit)="enviarFormulario()"
>

  <h2>
    {{ categoria ? 'Editar categoría' : 'Nueva categoría' }}
  </h2>

  <div class="form-group">
    <label for="codigo">Código *</label>

    <input
      id="codigo"
      name="codigo"
      type="text"
      [(ngModel)]="formulario.codigo"
      required
      maxlength="30"
      placeholder="Ejemplo: CAT000010"
    />
  </div>

  <div class="form-group">
    <label for="nombre">Nombre *</label>

    <input
      id="nombre"
      name="nombre"
      type="text"
      [(ngModel)]="formulario.nombre"
      required
      maxlength="100"
      placeholder="Ejemplo: Sopas"
    />
  </div>

  <div class="form-group">
    <label for="orden">Orden *</label>

    <input
      id="orden"
      name="orden"
      type="number"
      [(ngModel)]="formulario.orden"
      required
      min="1"
    />
  </div>

  <div class="form-group">
    <label for="activo">Estado</label>

    <select
      id="activo"
      name="activo"
      [(ngModel)]="formulario.activo"
    >
      <option [ngValue]="true">Activo</option>
      <option [ngValue]="false">Inactivo</option>
    </select>
  </div>

  <div class="form-actions">
    <button
      type="button"
      class="btn-cancelar"
      (click)="cancelarFormulario()"
      [disabled]="guardando"
    >
      Cancelar
    </button>

    <button
      type="submit"
      class="btn-guardar"
      [disabled]="categoriaForm.invalid || guardando"
    >
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>

</form>
